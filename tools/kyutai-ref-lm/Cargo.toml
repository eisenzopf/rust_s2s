[package]
name = "kyutai-ref-lm"
description = "Generates parity fixtures for s2s-model's Kyutai LM port by running Kyutai's own `moshi` crate (candle, CPU)."
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone: not part of the main workspace (see root Cargo.toml `exclude`).
[workspace]

[dependencies]
# moshi 0.6.4 on crates.io is byte-identical to kyutai-labs/moshi commit
# e6a55d2722a65870ef52a6c9f6ecfc0e90f38362 (rust/moshi-core/src). candle is pinned
# to the versions in that commit's rust/Cargo.lock.
moshi = "=0.6.4"
candle = { version = "=0.9.1", package = "candle-core" }
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
serde_json = "1"
anyhow = "1"
