[workspace]
resolver = "2"
members = [
    "crates/s2s-core",
    "crates/s2s-kernels",
    "crates/s2s-nn",
    "crates/s2s-train",
    "crates/s2s-tools",
    "crates/s2s-data",
    "crates/s2s-server",
    "crates/s2s-duplex",
    "crates/s2s-infer",
    "crates/s2s-model",
    "crates/s2s-mimi",
    "crates/s2s-cuda",
    "crates/s2s-gpu",
    "crates/s2s-tokenizer",
    "crates/s2s-eval",
]
# cuda-oxide crate: own toolchain (Rust 1.99.1), built with `cargo oxide`.
# kyutai-ref-lm / kyutai-ref-mimi: standalone fixture generators with their
# own dependency trees (Kyutai's candle-based `moshi` crate).
exclude = ["crates/s2s-simt", "tools/kyutai-ref-lm", "tools/kyutai-ref-mimi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eisenzopf/rust_s2s"

[workspace.dependencies]
s2s-core = { path = "crates/s2s-core" }
# CPU only: never enable the `cuda` feature through this entry.
s2s-kernels = { path = "crates/s2s-kernels", default-features = false }
s2s-model = { path = "crates/s2s-model" }
s2s-nn = { path = "crates/s2s-nn" }
s2s-tools = { path = "crates/s2s-tools" }
s2s-data = { path = "crates/s2s-data" }
s2s-train = { path = "crates/s2s-train" }
s2s-mimi = { path = "crates/s2s-mimi" }
s2s-tokenizer = { path = "crates/s2s-tokenizer" }
safetensors = "0.7"
num-traits = "0.2"
# Data pipeline (s2s-data).
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.4"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
toml = "0.8"
# Text tokenizer (s2s-tokenizer). No default features: `onig` and
# `esaxx_fast` compile C/C++ code and `progressbar` is for interactive
# training; `fancy-regex` is the pure-Rust backend for pre-tokenizer regexes.
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
# Evaluation (s2s-eval): FFT for log-mel distances; WAV I/O (also s2s-mimi).
rustfft = "6.4"
hound = "3.5"
# NVIDIA CUDA Rust (github.com/NVIDIA/cuda-rust, formerly NVlabs/cutile-rs and
# NVlabs/cuda-oxide). Every CUDA Rust crate comes from this one pinned
# revision: mixing a crates.io copy with a git copy yields two incompatible
# `cuda-core` runtimes, and cuTile (tile) and cuda-oxide (SIMT) kernels must
# share one runtime to run on the same streams and buffers. See ADR 0001.
cutile = { git = "https://github.com/NVIDIA/cuda-rust", rev = "367bc0f8e671070e00eebc7e5498f3e8eebefc72" }
cutile-ir = { git = "https://github.com/NVIDIA/cuda-rust", rev = "367bc0f8e671070e00eebc7e5498f3e8eebefc72" }
# cuBLASLt and NCCL for s2s-cuda (feature `cuda`). Dynamic loading: nothing is
# linked at build time, so it builds without CUDA libraries or a GPU, and the
# libraries are opened at first use. CUDA 13.0 bindings (driver R580+, same
# floor as cuTile).
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cublaslt", "nccl", "f16", "dynamic-loading", "cuda-13000"] }
half = "2"
cutile-compiler = { git = "https://github.com/NVIDIA/cuda-rust", rev = "367bc0f8e671070e00eebc7e5498f3e8eebefc72" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

# The CPU reference kernels are naive loops; optimize them even in test/dev
# builds so CPU training tests run in seconds instead of minutes.
[profile.dev.package.s2s-kernels]
opt-level = 3
[profile.dev.package.s2s-nn]
opt-level = 3
# Generic layer/kernel code is compiled in the crate that instantiates it.
[profile.dev.package.s2s-train]
opt-level = 3
[profile.dev.package.s2s-duplex]
opt-level = 3
[profile.dev.package.s2s-infer]
opt-level = 3
[profile.dev.package.s2s-model]
opt-level = 3
[profile.dev.package.s2s-mimi]
opt-level = 3
