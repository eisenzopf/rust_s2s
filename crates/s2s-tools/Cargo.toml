[package]
name = "s2s-tools"
description = "Tool-calling runtime for rust_s2s: tool registry and prompt rendering, tool-call span parser, llguidance JSON-schema grammar masks, async executor with client-tool bridge, and result injection formatting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
s2s-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# JSON-schema-constrained decoding (token bitmasks) and its tokenizer trie.
llguidance = "1.9.1"
toktrie = "1.9.1"
# Argument validation. Default features pull in HTTP/file `$ref` resolution,
# which tool schemas must not need.
jsonschema = { version = "0.60.2", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
s2s-kernels = { path = "../s2s-kernels" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[lints]
workspace = true
