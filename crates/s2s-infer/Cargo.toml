[package]
name = "s2s-infer"
description = "Streaming inference engine for rust_s2s: runs the duplex model frame by frame behind the s2s-server Engine trait, with grammar-constrained tool calls, the tool executor, result injection, and S2S/STT/TTS modes; plus an adapter that serves Kyutai Moshi and STT checkpoints through the same trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
s2s-core.workspace = true
s2s-kernels.workspace = true
s2s-duplex = { path = "../s2s-duplex" }
s2s-data.workspace = true
s2s-tools.workspace = true
s2s-server = { path = "../s2s-server" }
s2s-mimi.workspace = true
s2s-model.workspace = true
s2s-tokenizer.workspace = true
# GPU LM for the Kyutai server (feature `cuda`).
s2s-gpu = { path = "../s2s-gpu", optional = true }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[features]
default = []
# Run the Kyutai LM on the GPU in `s2s-kyutai-server` (needs CUDA headers to
# build and an sm_80+ GPU to run; see crates/s2s-gpu).
cuda = ["dep:s2s-gpu", "s2s-gpu/cuda"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"

[lints]
workspace = true
