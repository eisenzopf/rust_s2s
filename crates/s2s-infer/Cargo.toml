[package]
name = "s2s-infer"
description = "Streaming inference engine for rust_s2s: runs the duplex model frame by frame behind the s2s-server Engine trait, with grammar-constrained tool calls, the tool executor, result injection, and S2S/STT/TTS modes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
s2s-core.workspace = true
s2s-kernels.workspace = true
s2s-duplex = { path = "../s2s-duplex" }
s2s-data.workspace = true
s2s-tools.workspace = true
s2s-server = { path = "../s2s-server" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"

[lints]
workspace = true
